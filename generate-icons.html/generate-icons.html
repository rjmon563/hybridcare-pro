<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Iconos - HybridCare Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        
        h1 {
            color: #2d3748;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .subtitle {
            color: #718096;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .button-group {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(72,187,120,0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .preview-section {
            margin-top: 32px;
        }
        
        .preview-title {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 16px;
        }
        
        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            background: #f7fafc;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        
        .icon-preview {
            text-align: center;
            background: white;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .icon-preview img {
            display: block;
            margin-bottom: 8px;
            border-radius: 12px;
        }
        
        .icon-preview span {
            font-size: 12px;
            color: #718096;
        }
        
        .shortcut-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            background: #f7fafc;
            padding: 24px;
            border-radius: 20px;
        }
        
        .shortcut-item {
            text-align: center;
            background: white;
            padding: 16px;
            border-radius: 16px;
            min-width: 100px;
        }
        
        .status {
            margin-top: 24px;
            padding: 16px;
            background: #f0fff4;
            border-left: 4px solid #48bb78;
            border-radius: 12px;
            color: #2d3748;
        }
        
        .status.error {
            background: #fff5f5;
            border-left-color: #e53e3e;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>🔋</span> HybridCare Pro
            <span style="font-size: 14px; background: #48bb78; color: white; padding: 2px 8px; border-radius: 20px;">Generador</span>
        </h1>
        <div class="subtitle">Generador automático de iconos profesionales para la aplicación</div>
        
        <div class="button-group">
            <button onclick="generateAllIcons()">🎨 Generar todos los iconos</button>
            <button class="btn-secondary" onclick="downloadAllIcons()">📦 Descargar todos los iconos</button>
            <button onclick="generateZip()">📁 Descargar como ZIP</button>
        </div>
        
        <div id="status"></div>
        
        <div class="preview-section" id="previewSection" style="display: none;">
            <div class="preview-title">📱 Iconos principales</div>
            <div id="previewGrid" class="preview-grid"></div>
            
            <div class="preview-title">⚡ Iconos de accesos directos</div>
            <div id="shortcutGrid" class="shortcut-grid"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const shortcutTypes = [
            { name: 'diagnostic', label: 'Diagnóstico', emoji: '🔧' },
            { name: 'history', label: 'Historial', emoji: '📊' },
            { name: 'trip', label: 'Viaje', emoji: '🚗' },
            { name: 'connect', label: 'Conectar', emoji: '📡' }
        ];
        
        let generatedIcons = {};
        let generatedShortcuts = {};
        
        function drawIcon(ctx, size, type = 'main', emoji = '🔋') {
            const center = size / 2;
            const radius = size * 0.38;
            
            // Fondo gradiente
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#1e3c72');
            grad.addColorStop(1, '#2a5298');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            
            // Círculo interior
            ctx.fillStyle = '#48bb78';
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Sombra
            ctx.shadowBlur = size * 0.03;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            
            // Icono emoji
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.45}px "Segoe UI", "Apple Color Emoji", "Noto Color Emoji"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, center, center);
            
            // Reset shadow
            ctx.shadowBlur = 0;
            
            // Borde decorativo
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = size * 0.02;
            ctx.beginPath();
            ctx.arc(center, center, radius + size * 0.03, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        function generateAllIcons() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status">🔄 Generando iconos... Por favor espera.</div>';
            
            generatedIcons = {};
            
            // Generar iconos principales
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                drawIcon(ctx, size, 'main', '🔋');
                generatedIcons[size] = canvas.toDataURL('image/png');
            });
            
            // Generar iconos de shortcuts
            shortcutTypes.forEach(shortcut => {
                const canvas = document.createElement('canvas');
                canvas.width = 96;
                canvas.height = 96;
                const ctx = canvas.getContext('2d');
                drawIcon(ctx, 96, shortcut.name, shortcut.emoji);
                generatedShortcuts[shortcut.name] = canvas.toDataURL('image/png');
            });
            
            // Mostrar preview
            showPreview();
            
            statusDiv.innerHTML = '<div class="status">✅ ¡Iconos generados correctamente! Haz clic en "Descargar todos los iconos" para obtenerlos.</div>';
        }
        
        function showPreview() {
            const previewSection = document.getElementById('previewSection');
            const previewGrid = document.getElementById('previewGrid');
            const shortcutGrid = document.getElementById('shortcutGrid');
            
            previewSection.style.display = 'block';
            
            // Iconos principales
            previewGrid.innerHTML = '';
            sizes.forEach(size => {
                const div = document.createElement('div');
                div.className = 'icon-preview';
                div.innerHTML = `
                    <img src="${generatedIcons[size]}" width="${Math.min(size, 64)}" height="${Math.min(size, 64)}" style="border-radius: 12px;">
                    <span>${size}x${size}</span>
                `;
                previewGrid.appendChild(div);
            });
            
            // Iconos shortcuts
            shortcutGrid.innerHTML = '';
            shortcutTypes.forEach(shortcut => {
                const div = document.createElement('div');
                div.className = 'shortcut-item';
                div.innerHTML = `
                    <img src="${generatedShortcuts[shortcut.name]}" width="64" height="64" style="border-radius: 12px; margin-bottom: 8px;">
                    <div style="font-size: 12px; font-weight: 600;">${shortcut.label}</div>
                    <div style="font-size: 10px; color: #718096;">icon-${shortcut.name}-96.png</div>
                `;
                shortcutGrid.appendChild(div);
            });
        }
        
        function downloadAllIcons() {
            if (Object.keys(generatedIcons).length === 0) {
                alert('Primero genera los iconos haciendo clic en "Generar todos los iconos"');
                return;
            }
            
            // Descargar iconos principales
            sizes.forEach(size => {
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = generatedIcons[size];
                link.click();
            });
            
            // Descargar iconos shortcuts
            shortcutTypes.forEach(shortcut => {
                const link = document.createElement('a');
                link.download = `icon-${shortcut.name}-96.png`;
                link.href = generatedShortcuts[shortcut.name];
                link.click();
            });
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status">📦 Descarga iniciada. Crea una carpeta "icons" y coloca todos los iconos allí.</div>';
        }
        
        async function generateZip() {
            if (Object.keys(generatedIcons).length === 0) {
                alert('Primero genera los iconos');
                return;
            }
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status">📦 Creando archivo ZIP...</div>';
            
            const zip = new JSZip();
            const iconsFolder = zip.folder("icons");
            
            // Agregar iconos principales
            for (const size of sizes) {
                const base64Data = generatedIcons[size].split(',')[1];
                iconsFolder.file(`icon-${size}.png`, base64Data, { base64: true });
            }
            
            // Agregar iconos shortcuts
            for (const shortcut of shortcutTypes) {
                const base64Data = generatedShortcuts[shortcut.name].split(',')[1];
                iconsFolder.file(`icon-${shortcut.name}-96.png`, base64Data, { base64: true });
            }
            
            // Generar y descargar ZIP
            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "hybridcare-icons.zip";
            link.click();
            URL.revokeObjectURL(link.href);
            
            statusDiv.innerHTML = '<div class="status">✅ ZIP generado correctamente. Descomprime y coloca la carpeta "icons" en la raíz de la aplicación.</div>';
        }
        
        // Generar automáticamente al cargar
        generateAllIcons();
    </script>
</body>
</html>
